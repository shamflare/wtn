<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بنك أسئلة القلبية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: single reading column; sticky top bar with year tabs + live score; ECG-paper grid in the header band */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --ink: #1b2330;
  --muted: #5d6878;
  --line: #dde2ea;
  --accent: #b4233c;          /* ECG trace red */
  --accent-soft: #fbe9ec;
  --grid: rgba(180, 35, 60, .09);
  --ok: #1d7a46;
  --ok-bg: #e3f4ea;
  --ok-line: #57b37f;
  --bad: #b3261e;
  --bad-bg: #fbe5e3;
  --bad-line: #e0786f;
  --hover: #eef1f6;
  --font-ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1a2029; --ink: #e6e9ef; --muted: #9aa4b4; --line: #2c3442;
    --accent: #ef6a7f; --accent-soft: #3a1f27; --grid: rgba(239, 106, 127, .08);
    --ok: #7fd9a3; --ok-bg: #173526; --ok-line: #2f8a57;
    --bad: #ff9c94; --bad-bg: #3d1d1c; --bad-line: #a8443c;
    --hover: #222a35; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1a2029; --ink: #e6e9ef; --muted: #9aa4b4; --line: #2c3442;
  --accent: #ef6a7f; --accent-soft: #3a1f27; --grid: rgba(239, 106, 127, .08);
  --ok: #7fd9a3; --ok-bg: #173526; --ok-line: #2f8a57;
  --bad: #ff9c94; --bad-bg: #3d1d1c; --bad-line: #a8443c;
  --hover: #222a35; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); direction: rtl;
  font-family: var(--font-ui); font-size: 16px; line-height: 1.7;
  padding-inline: 16px; padding-block: 0 64px;
}
.wrap { max-width: 820px; margin-inline: auto; }

header.hero {
  margin-inline: -16px; padding: 28px 16px 22px;
  background-color: var(--surface);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 12px 12px;
  border-bottom: 1px solid var(--line);
}
.hero h1 { margin: 0; font-size: clamp(1.5rem, 4.5vw, 2.1rem); font-weight: 700; text-wrap: balance; }
.hero p { margin: 4px 0 0; color: var(--muted); }
.trace { display: block; width: 100%; max-width: 820px; height: 36px; margin-top: 10px; }
.trace path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin-inline: -16px; padding: 10px 16px;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.tabs { display: flex; gap: 6px; }
.tab {
  font: inherit; font-weight: 600; cursor: pointer;
  padding: 6px 18px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.score { display: flex; gap: 14px; align-items: center; margin-inline-start: auto; font-size: .95rem; color: var(--muted); }
.score b { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; }
.score .c b { color: var(--ok); }
.score .w b { color: var(--bad); }
.reset {
  font: inherit; font-size: .9rem; cursor: pointer; padding: 5px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
}
.reset:hover { color: var(--ink); background: var(--hover); }
.progress { height: 3px; background: var(--line); margin-top: 10px; border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }

.list { display: flex; flex-direction: column; gap: 18px; margin-top: 22px; }
.q {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 18px; min-width: 0;
}
.q-head { display: flex; gap: 12px; align-items: flex-start; }
.num {
  flex: none; font-family: var(--font-num); font-weight: 600; font-size: .9rem;
  min-width: 2.6em; text-align: center; padding: 2px 6px; border-radius: 6px;
  background: var(--accent-soft); color: var(--accent);
}
.stem { margin: 0; font-weight: 600; min-width: 0; white-space: pre-line; overflow-wrap: anywhere; }
.shared { margin: 0 0 10px; font-size: .92rem; color: var(--muted); }
.fig { display: block; width: 100%; max-width: 100%; margin-top: 12px; border-radius: 6px; border: 1px solid var(--line); }
.opts { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.opt {
  width: 100%; display: flex; gap: 10px; align-items: flex-start; text-align: start;
  font: inherit; color: var(--ink); cursor: pointer;
  padding: 10px 12px; border-radius: 9px;
  border: 1px solid var(--line); background: transparent;
}
.opt:hover:not(:disabled) { background: var(--hover); }
.opt:focus-visible, .tab:focus-visible, .reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt:disabled { cursor: default; }
.opt .l { flex: none; font-family: var(--font-num); font-weight: 600; color: var(--muted); }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt.correct { background: var(--ok-bg); border-color: var(--ok-line); }
.opt.correct .l, .opt.correct .t { color: var(--ok); font-weight: 600; }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad-line); }
.opt.wrong .l, .opt.wrong .t { color: var(--bad); }
.verdict { margin: 10px 0 0; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.retry {
  font: inherit; font-size: .85rem; font-weight: 500; cursor: pointer; padding: 2px 10px; border-radius: 6px;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
}
.retry:hover { color: var(--ink); background: var(--hover); }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>

  <div class="wrap">
    <h1>بنك أسئلة القلبية</h1>

    <svg class="trace" viewBox="0 0 820 36" preserveAspectRatio="none" aria-hidden="true">

</div>

<main class="wrap">
  <div class="list" id="list"></div>
</main>

رتفاع التوتر الشرياني"}, {"letter": "B", "text": "يعتبر اشيع عند الاناث من الذكور"}, {"letter": "C", "text": "يعتبر الألم الصدري والخفقان من الاعراض الشائعة عن الشباب"}, {"letter": "D", "text": "تسمع نفخة منتصف انقباض على الجزء الامامي للبطن بشكل شائع"}, {"letter": "E", "text": "يترافق عادة مع فتحة بين اذينتين"}], "answer": "A"}, {"num": 74, "text": "في مرضى ارتفاع الضغط الشرياني، اختر العبارة الصح :", "options": [{"letter": "A", "text": "يزداد حدوث الاعراض الجانبية مع زيادة الجرعة في كل أنواع خافضات الضغط"}, {"letter": "B", "text": "انخفاض الضغط الشرياني المفاجئ في هجمات ارتفاع الضغط قد يكون له عواقب كارثية"}, {"letter": "C", "text": "حاصرات الفا المحيطية ،وحاصرات قنوات الكلس ، أكثر فعالية في السود منه في البيض"}, {"letter": "D", "text": "بشكل عام ،ان اعطاء جرعات عالية من خافضات الضغط ضروري لدى المسنين"}, {"letter": "E", "text": "ارتفاع الضغط الشرياني الحملي لا ينبئ بمستقبل صحي سيئ لدى النساء"}], "answer": "B"}, {"num": 75, "text": "كل ما يلي حول العاصفة الكهربائية صحيح ماعدا :", "options": [{"letter": "A", "text": "يعتبرالتخدير العام احد الخطوط العلاجية"}, {"letter": "B", "text": "يفيد بالون النبضان المعاكس عندما يكون الاقفارسبب لها"}, {"letter": "C", "text": "تفيد اعادة التروية عندما يكون الاقفارسبب لها"}, {"letter": "D", "text": "تعتبرالقثطرة الكهربائية احدى خطوط العلاج بعد فشل الادوية"}, {"letter": "E", "text": "يمكن ان يفيد الناظم ثنائي الحجرة الدائم"}], "answer": "E"}, {"num": 76, "text": "Each of the following predisposes to the (Torsades de pointes) Except :", "options": [{"letter": "A", "text": "Congenital severe bradycardia"}, {"letter": "B", "text": "Hypokalemia"}, {"letter": "C", "text": "Loss of function mutation in the SCN5A gene"}, {"letter": "D", "text": "Tricyclic antidepressants overdose"}, {"letter": "E", "text": "Disopyramide"}], "answer": "C"}, {"num": 77, "text": "Which of the following regarding the intraoperative evaluation of the pacing system is false :", "options": [{"letter": "A", "text": "Wire fracture usually presents with a low impedance"}, {"letter": "B", "text": "Insulation break usually presents with a low impedance"}, {"letter": "C", "text": "Lead dislodgment typically presents with a high voltage threshold"}, {"letter": "D", "text": "Exit block typically presents with a high voltage threshold"}], "answer": "A"}, {"num": 78, "text": "The carotid pulse in isolated, severe aortic stenosis may show each of the following characteristics Except :", "options": [{"letter": "A", "text": "Bisferiens pulse"}, {"letter": "B", "text": "Slowed upstroke"}, {"letter": "C", "text": "Delayed peak"}, {"letter": "D", "text": "Reduced volume"}, {"letter": "E", "text": "Palpable vibrations (\"shudder\")"}], "answer": "A"}, {"num": 79, "text": "All the following clinical findings are typical for uncomplicated atrial septal defect Except :", "options": [{"letter": "A", "text": "Pulmonic component of S2 is audible at the apex"}, {"letter": "B", "text": "Pulmonary ejection sound"}, {"letter": "C", "text": "Large A waves are present in jugular venous pulse contour"}, {"letter": "D", "text": "Systolic ejection murmur is audible over the pulmonary area"}, {"letter": "E", "text": "Wide, persistent splitting of S2"}], "answer": "C"}, {"num": 80, "text": "Which of the following is false regarding the occurrence of complete ( third-degree) heart block in inferior acute myocardial infarction :", "options": [{"letter": "A", "text": "It may take 5 to 7 days to resolve"}, {"letter": "B", "text": "The rate is usually greater than 40 beats/min"}, {"letter": "C", "text": "The QRS is usually wide"}, {"letter": "D", "text": "Pacing may be required if the patient is hemodynamically unstable"}], "answer": "C"}, {"num": 81, "text": "In a patient with acute anterior myocardial infarction and third-degree heart block complicated by congestive heart failure requiring temporary ventricular pacing, all the following may improve hemodynamics Except :", "options": [{"letter": "A", "text": "Reperfusion of the culprit artery"}, {"letter": "B", "text": "Increasing the pacing rate"}, {"letter": "C", "text": "Atrial-based pacing"}, {"letter": "D", "text": "Intra-aortic balloon pump"}], "answer": "B"}, {"num": 82, "text": "A 53-year-old woman presents with exertional dyspnea and is found to have a large pericardial effusion, jugular venous distention, and hypotension. Which of the following echocardiographic signs is likely present؟", "options": [{"letter": "A", "text": "Collapse of the right ventricle throughout systole"}, {"letter": "B", "text": "Exaggerated decrease in tricuspid infow velocity during inspiration"}, {"letter": "C", "text": "Exaggerated decrease in mitral infow velocity during inspiration"}, {"letter": "D", "text": "Exaggerated increase in left ventricular outfow tract velocity during inspiration"}, {"letter": "E", "text": "Markedly increased E/A ratio of the transmitral Doppler velocity profile"}], "answer": "C"}, {"num": 83, "text": "A 57-year-old man develops mild anterior chest heaviness at 6 minutes into the Bruce protocol . He is heavy smoker, and his father died of MI at age of 68 years. His baseline ECG shows Q waves in the inferior leads, and at exercise the ECG demonstrates ST elevation in lateral leads. Which of the following statements regarding ST-segment elevation during exercise testing is correct:", "options": [{"letter": "A", "text": "ST- elevation during exercise test is a common finding in patients with coronary artery disease"}, {"letter": "B", "text": "ST- elevation in a lead that contains a pathologic Q wave at baseline indicates severe ischemia"}, {"letter": "C", "text": "The electrocardiographic leads that manifest ST-segment elevation during exercise localize the anatomic regions of ischemia"}, {"letter": "D", "text": "ST- elevation that develops during exercise is usually a manifestation of benign early repolarization"}, {"letter": "E", "text": "ST- elevation during exercise is commonly associated with the development of complete heart block"}], "answer": "C"}, {"num": 84, "text": "A 59-year- old black man takes atorvastatin 10 mg daily for dyslipidemia. His blood pressure is 138/83 mm Hg, He does not smoke but alcoholic. His body mass index is 28 kg/m 2. His predicted 10-year risk for a first atherosclerotic cardiovascular event is 12% using the ACC/AHA pooled cohort risk assessment equations. Which of the following statements is consistent with current ACC/AHA hypertension guidelines؟", "options": [{"letter": "A", "text": "His blood pressure is not in a range that requires intervention; only serial monitoring of blood pressure is needed"}, {"letter": "B", "text": "He should follow lifestyle modifications, including weight loss and cessation of alcohol intake, but drug therapy should not be initiated at this point"}, {"letter": "C", "text": "He should follow lifestyle modifications and begin antihypertensive drug therapy using a beta blocker or angiotensin-converting enzyme inhibitor"}, {"letter": "D", "text": "His target on-therapy blood pressure is less than 130/80mm Hg"}], "answer": "D"}, {"num": 85, "text": "A 58-year-old diabetic woman with previous PCI 2 years ago,. She is taking aspirin 81 mg daily, atorvastatin 80 mg daily, metoprolol 50 mg twice daily, metformin 500 mg daily, and dapagliflozin 10 mg daily. Her lipid profile demonstrates LDL cholesterol level of 65 mg/dL and a fasting triglyceride level of 250 mg/dL. She engages in minimal exercise and has no active cardiovascular symptoms. Which of the following statements is correct؟", "options": [{"letter": "A", "text": "Her LDL is in target range; additional lipid altering interventions would not reduce future cardiac event risk"}, {"letter": "B", "text": "Icosapent ethyl contains the same chemical preparation as in over-the-counter fish oil preparations"}, {"letter": "C", "text": "Only triglyceride concentrations greater than 500 mg/ dL contribute to atherogenic risk"}, {"letter": "D", "text": "The addition of icosapent ethyl to this patient's regimen would be expected to reduce the risk of future ischemic events by 25%"}], "answer": "D"}, {"num": 86, "text": "Which of the following is a feature of reno-vascular hypertension due to atherosclerosis as opposed to fibromuscular hyperplasia؟", "options": [{"letter": "A", "text": "Age less than 60 years"}, {"letter": "B", "text": "Female gender"}, {"letter": "C", "text": "No family history of hypertension"}, {"letter": "D", "text": "Progression more likely to complete renal artery occlusion"}, {"letter": "E", "text": "Absence of carotid bruits"}], "answer": "D"}, {"num": 87, "text": "A 77-year-old woman with non-valvular atrial fibrillation, hypertension, and peripheral artery disease presents to the emergency department with anterior MI which was treated with primary PCI with a drug-eluting stent. In consideration of subsequent medications, which of the following statements about combined anticoagulant and antiplatelet therapy is correct؟", "options": [{"letter": "A", "text": "Oral anticoagulation therapy plus clopidogrel, without aspirin (\"double therapy\"), significantly reduces bleeding rates compared with \"triple therapy\" (anticoagulation plus aspirin and clopidogrel) in patients with a need for long-term anticoagulation who undergo PCI"}, {"letter": "B", "text": "Rivaroxaban 15mg daily plus a P2Y 12 receptor inhibitor has been shown to be as beneficial as the combination of warfarin plus dual antiplatelet therapy (aspirin + P2Y 12 inhibitor) for prevention of ischemic events in patients undergoing PCI"}, {"letter": "C", "text": "After an acute coronary syndrome (ACS), the addition of very low-dose rivaroxaban (2.5 or 5mg twice daily) to aspirin plus a P2Y12 inhibitor reduces the risk of cardiovascular death, nonfatal MI, or stroke without increasing the bleeding risk"}, {"letter": "D", "text": "Substituting rivaroxaban 2.5 mg BID for low-dose aspirin following a recent ACS reduces the rate of cardiovascular death but increases the bleeding risk"}], "answer": "A"}, {"num": 88, "text": "A 72-year-old man with nonischemic dilated cardiomyopathy, EF 38%, NYHA class III symptoms, and chronic kidney disease (creatinine = 2.8 mg/dL) presents with symptomatic paroxysmal atrial fibrillation. ECG when in sinus rhythm shows a corrected QT interval of 442 milliseconds. Which of the following is the most appropriate initial oral antiarrhythmic regimen to maintain sinus rhythm in this patient؟", "options": [{"letter": "A", "text": "Outpatient initiation of dofetilide 250mcg twice daily"}, {"letter": "B", "text": "Outpatient initiation of sotalol 120mg twice daily"}, {"letter": "C", "text": "Inpatient initiation of disopyramide extended release 200mg every 12 hours"}, {"letter": "D", "text": "Inpatient initiation of dronedarone 400 mg twice daily with close ECG monitoring"}, {"letter": "E", "text": "Outpatient oral amiodarone 200 mg three times daily for 2 weeks followed by 200mg daily"}], "answer": "E"}, {"num": 89, "text": "63-year-old man has a history of unrepaired PDA and VSD with long-standing cyanosis. He is admitted to the hospital because of urinary sepsis, and intravenous ciprofloxacin is initiated. Oral tamsulosinis begun for prostatic obstruction. His fever resolves, but over the next day he develops hypotension and worsening cyanosis. Which of the following interventions would be most appropriate؟", "options": [{"letter": "A", "text": "Intravenous methylprednisolone and cefepime"}, {"letter": "B", "text": "Intravenous dobutamine and oral sildenafil"}, {"letter": "C", "text": "Intravenous phenylephrine and cessation of tamsulosin"}, {"letter": "D", "text": "Intravenous saline and magnesium"}], "answer": "C"}, {"num": 90, "text": "In patients with pulmonary arterial hypertension, which of the following is the most reliable predictor of mortality؟", "options": [{"letter": "A", "text": "Elevated right atrial pressure"}, {"letter": "B", "text": "Elevated mean pulmonary artery pressure"}, {"letter": "C", "text": "Diastolic septal flattening on transthoracic echocardiography"}, {"letter": "D", "text": "Transpulmonary gradient of 10 mmHg or less"}], "answer": "A"}, {"num": 91, "text": "A 60-year-old woman, presents for evaluation of known mitral stenosis. Over the past few months she has developed worsening exertional dyspnea, atrial fibrillation, and is found to have moderate pulmonary hypertension. Which of the following statements regarding percutaneous balloon mitral valvuloplasty for this condition is TRUE:", "options": [{"letter": "A", "text": "The risk of stroke during the procedure is 10%"}, {"letter": "B", "text": "Transthoracic echocardiography is the appropriate imaging study before the procedure to exclude the presence of left atrial thrombus"}, {"letter": "C", "text": "Balloon mitral valvuloplasty is the treatment of choice for patients with hemodynamically significant mitral stenosis, without left atrial thrombus and an echo score of 8 or less"}, {"letter": "D", "text": "A small atrial septal defect is detected in 25% of patients after the procedure"}, {"letter": "E", "text": "Approximately 10% of patients develop severe mitral regurgitation as a result of the procedure"}], "answer": "C"}, {"num": 92, "text": "A 63-year-old man with COPD presents for evaluation of progressive dyspnea. Resting arterial blood gas analysis demonstrates a partial pressure of oxygen of 66 mm Hg. An echocardiogram shows normal LVEF, RV hypertrophy and dilation, and an elevated estimated pulmonary artery systolic pressure. Which of the following therapies would improve outcomes in this patient:", "options": [{"letter": "A", "text": "Digoxin"}, {"letter": "B", "text": "Oxygen"}, {"letter": "C", "text": "Beta-adrenergic agonists"}, {"letter": "D", "text": "Theophylline"}, {"letter": "E", "text": "Bosentan"}], "answer": "B"}, {"num": 93, "text": "A 57-year-old woman with CKD presents to the emergency department because of sudden shortness of breath and right-sided chest pain. She has no recent history of immobilization, surgery, or travel. Which of the following results is most useful in EXCLUDING the diagnosis of pulmonary embolism:", "options": [{"letter": "A", "text": "Normal partial oxygen pressure by arterial blood gas analysis"}, {"letter": "B", "text": "Normal cardiopulmonary examination"}, {"letter": "C", "text": "Intermediate probability ventilation-perfusion lung scan"}, {"letter": "D", "text": "Normal plasma level of D-dimer"}, {"letter": "E", "text": "Absence of S1Q3T3 pattern on ECG"}], "answer": "D"}, {"num": 94, "text": "A 34-year-old woman is receiving doxorubicin chemotherapy for breast cancer. Which of the following statements regarding the risk of doxorubicin-induced cardiomyopathy is correct:", "options": [{"letter": "A", "text": "Previous mediastinal irradiation increases the long-term risk of valvular disease and coronary artery disease but not cardiomyopathy"}, {"letter": "B", "text": "Age is not a risk factor for the development of cardio-myopathy"}, {"letter": "C", "text": "Cardiomyopathy can develop with a total cumulative dose of less than 400mg/m2"}, {"letter": "D", "text": "Continuous infusion of an anthracycline confers a greater risk ofcardiotoxicity than iv bolus dosing"}], "answer": "C"}, {"num": 95, "text": "A 37-year-old man presents complains of exertional dyspnea. His medical history is significant for chest radiation therapy for treatment for lymphoma. Regarding cardiovascular effects of radiation therapy, which of the following statements is correct:", "options": [{"letter": "A", "text": "Most cardiovascular complications develop within 5 years of radiation exposure"}, {"letter": "B", "text": "Constrictive pericarditis is typically an acute reaction to radiation therapy"}, {"letter": "C", "text": "The conduction system is typically spared from adverse effects of radiation"}, {"letter": "D", "text": "Dilated cardiomyopathy is the most common manifestation of mediastinal radiation therapy"}, {"letter": "E", "text": "Cancer survivors who received head and neck radiation are at a heightened risk of stroke"}], "answer": "E"}, {"num": 96, "text": "A 68-year-old woman with type 2 diabetes is admitted to ICU with hypoxemic respiratory failure 1 week after SARS-CoV-2 infection. On the fourth hospital day she is noted to have asymmetric edema of her left leg. A lower extremity venous ultrasound study reveals left common femoral deep venous thrombosis. Which of the following is TRUE regarding thromboembolic complications of COVID-19:", "options": [{"letter": "A", "text": "Arterial thrombotic complications are more common than venous thromboembolic complications"}, {"letter": "B", "text": "The risk of thromboembolic complications is higher in COVID-19 patients admitted to the ICU compared with those not in the ICU"}, {"letter": "C", "text": "Unlike patients hospitalized for other conditions, low D-dimer levels do no not exclude pulmonary embolism in patients with COVID-19"}, {"letter": "D", "text": "The majority of COVID-19 patients with venous thromboembolism have concurrent myocarditis"}], "answer": "B"}, {"num": 97, "text": "A 35-year-old woman presents at the 36th week of pregnancy because of severe substernal chest pain over the past hour. An electrocardiogram demonstrates 2,5 mm ST-segment elevations in leads V 1 to V4. Which of the following statements is correct:", "options": [{"letter": "A", "text": "Coronary artery spasm is the most common cause of this presentation during pregnancy"}, {"letter": "B", "text": "Spontaneous coronary artery dissection is the most likely cause in the peripartum period"}, {"letter": "C", "text": "Pregnancy does not alter the risk of sustaining a myocardial infarction"}, {"letter": "D", "text": "Inferior wall MI is more common than anterior wall MI during pregnancy"}, {"letter": "E", "text": "Pregnancy is an absolute contraindication to angiography"}], "answer": "B"}, {"num": 98, "text": "A 52-year-old man presents with recent fatigue and weight gain. Laboratory evaluation reveals a markedly elevated thyroid-stimulating hormone level. Which of the following is NOT a common cardiac finding in patients with hypothyroidism:", "options": [{"letter": "A", "text": "Hypotension"}, {"letter": "B", "text": "Decreased heart rate"}, {"letter": "C", "text": "Pericardial effusion"}, {"letter": "D", "text": "Decreased cardiac output"}, {"letter": "E", "text": "Prolonged QT interval on the electrocardiography"}], "answer": "A"}, {"num": 99, "text": "A 58-year-old obese man presents for evaluation of excessive day-time sleepiness. He is snoring and gasping at night. Which of the following statements regarding sleep-related breathing disorders and cardiovascular disease is NOT correct:", "options": [{"letter": "A", "text": "Individuals with obstructive sleep apnea exhibit persistently increased sympathetic activity, even during daytime wakefulness"}, {"letter": "B", "text": "Obstructive sleep apnea is associated with drug-resistant hypertension, automatic tachycardias, and nocturnal bradycardias"}, {"letter": "C", "text": "Positive airway pressure therapy in obstructive sleep apnea is associated with improved health-related quality of life, mood, and blood pressure"}, {"letter": "D", "text": "Unlike obstructive sleep apnea, central sleep apnea is not associated with cardiovascular disease"}, {"letter": "E", "text": "Positive airway pressure benefits both obstructive sleep apnea and central sleep apnea"}], "answer": "D"}, {"num": 100, "text": "A 66-year-old man with CKD is referred for evaluation after a recent admission for an acute coronary syndrome (ACS). Which of the following statements is concerning CKD and cardiovascular disease is TRUE:", "options": [{"letter": "A", "text": "Patients with CKD are at higher risk of bleeding but at lower risk of thrombotic events compared with normal individuals"}, {"letter": "B", "text": "The outcomes of patients with CKD who present with ACS are similar to those of patients with normal renal function"}, {"le  "E", "text": "ذكر مع سوابق TIA وتضيق سباتي ٨٥%"}], "answer": "E"}, {"num": 10, "text": "راجع رجل ٦٥سنة بقصة ألم صدري على الجهد، لا يوجد لديه ألم على الراحة وقد تحسنت أعراضه بعد البدء بـ بيزوبرولول ٢,٥ملغ. تخطيط الراحة لم يظهر أي تبدلات والتروبونين كان سلبياً. يوجد لديه قصة عائلية للأمراض الإكليلية ولايوجد أي عامل خطر آخر. الاستقصاء الذي تقترحه:", "options": [{"letter": "A", "text": "CT للشرايين الإكليلية"}, {"letter": "B", "text": "قثطرة قلبية"}, {"letter": "C", "text": "اختبار جهد على البساط"}, {"letter": "D", "text": "ايكو جهد"}, {"letter": "E", "text": "تصوير بالنظائر المشعة"}], "answer": "A"}, {"num": 11, "text": "امرأة ٦٥ سنة لديها اعتلال قلب اقفاري مع EF =٣٠% راجعتك بزلة تنفسية NYHA II وسابقاً كانت قد أجرت توسيع للشرايين الإكليلية بالقثطرة. حالياً هي على العلاج الدوائي المثالي لقصور القلب، تخطيط الراحة كان جيبيا مع وجود COMPLETE LBBB مع محور أيسر و QRS=165 ms و PR=180 ms  ما هو العلاج الذي تقترحه تاليا:", "options": [{"letter": "A", "text": "استشارة من أجل زرع القلب"}, {"letter": "B", "text": "تنصح بزرع ICD"}, {"letter": "C", "text": "تنصح بزرع CRT-D"}, {"letter": "D", "text": "تنصح ب CRT-P"}, {"letter": "E", "text": "البقاء على العلاج الدوائي"}], "answer": "C"}, {"num": 12, "text": "مريض ٣٨ سنة مدمن مخدرات وريدية راجع بقصة تعب وعرواءات وترفع حروري ٣٨,٥، لوحظ بإصغاء القلب نفخة شاملة للانقباض أشدها على الحافة اليسرى للقص، تم أخذ ثلاث عينات دم لزراعتها، أجري للمريض ايكو للقلب أظهر نبت على الصمام مثلث الشرف مع وجود قصور مثلث شرف متوسط الشدة، أي من الكائنات التالية الأكثر احتمالية لتواجدها أثناء زرع الدم؟", "options": [{"letter": "A", "text": "streptococcus sanguis"}, {"letter": "B", "text": "entero coccus faecium"}, {"letter": "C", "text": "coxiella burnetiid"}, {"letter": "D", "text": "staphylo coccus aureus"}, {"letter": "E", "text": "kingella Kingae"}], "answer": "D"}, {"num": 13, "text": "عند إجراء ايكو قلب عبر الصدر، أي من الموجودات التالية لا يشير لقصور أبهري شديد؟", "options": [{"letter": "A", "text": "Vena contracta 0.5 cm"}, {"letter": "B", "text": "Central jet width 70% of LVOT"}, {"letter": "C", "text": "Holo-diastolic aortic flow reversal in descending aorta"}, {"letter": "D", "text": "Pressure half time 190 ms"}, {"letter": "E", "text": "Effective regurgitant orifice area >= 0.3 cm²"}], "answer": "A"}, {"num": 14, "text": "راجع مريض ذكر ٦٣سنة بقصة ألم ظهري حاد ومفاجئ مع وهط دوراني، أبدى التصوير الطبقي المحوري وجود تسلخ أبهر حاد ممتد من sinuses of valsalva حتى قوس الأبهر مع وجود انصباب تامور متوسط الكمية. الإجراء الأنسب هو:", "options": [{"letter": "A", "text": "بزل التامور إسعافياً ثم تحويل المريض لإجراء جراحة اسعافية"}, {"letter": "B", "text": "ارسال المريض بشكل عاجل لأقرب مركز جراحة قلبية لإجراء جراحة اسعافية"}, {"letter": "C", "text": "تحسين حالة المريض بإعطائه السوائل الوريدية ثم إعادة ايكو القلب"}, {"letter": "D", "text": "اجراء ايكو قلب عبر المري بشكل عاجل لتقيم مكان dissection flap وتحديد مكان الناسور fistula من الأبهر للتامور"}, {"letter": "E", "text": "إجراء CT للشرايين الاكليلية لتقيم الحاجة لإجراء إعادة التروية الاكليلية"}], "answer": "B"}, {"num": 15, "text": "في وذمة الرئة الحادة التي أعطي المريض فيها الفورسمايد وريدياً، وكان الضغط الشرياني ٥٠/٨٥ ملمز بعدها مع بقاء الأكسجة منخفضة بالرغم من الأكسجين عالي الجريان. الخطوة القادمة:", "options": [{"letter": "A", "text": "تهوية آلية بالمنفسة"}, {"letter": "B", "text": "البدء بمضخة الدوبامين"}, {"letter": "C", "text": "إعطاء السؤال الوريدية"}, {"letter": "D", "text": "البدء بمضخة النترات"}, {"letter": "E", "text": "البدء بمضخة الفورسيمايد"}], "answer": "A"}, {"num": 16, "text": "مريض احتشاء عضلة قلبية أمامي عولج بشكل ناجح بالـ (PCI) وبعد ٤٨ ساعة تم تحويل المريض من العناية الإسعافية للجناح، في سوابق المريض قصة ارتفاع توتر شرياني وداء سكري. الجزء المقذوف بايكو قلب ٤٠ %، والضغط ٧٠/١١٠ ملمز وضربات القلب ٥٥ ضربة/د ، المريض معالج بـ راميبريل ٢,٥ ملغ مرتين يومياً و بيزوبرولول ٢,٥ملغ  مرة يومياً، الخطوة التالية لتحسين العلاج الطبي للمريض:", "options": [{"letter": "A", "text": "إضافة فيروسيمايد ٤٠ ملغ مرة يومياً"}, {"letter": "B", "text": "إنقاص البزوبرولول"}, {" const KEY = "cardio-quiz-answers-v1";
let picks = {};
try { picks = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { picks = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(picks)); } catch (e) {} }

const years = Object.keys(DATA);
let year = years[0];
try { const y = localStorage.getItem(KEY + "-year"); if (y && DATA[y]) year = y; } catch (e) {}
if (location.hash && DATA[location.hash.slice(2)]) year = location.hash.slice(2);

const tabsEl = document.getElementById("tabs");
const listEl = document.getElementById("list");

function idOf(q) { return year + "-" + q.num; }

function renderTabs() {
  tabsEl.innerHTML = "";
  years.forEach(y => {
    const b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.id = "tab-" + y;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", y === year ? "true" : "false");
    b.textContent = y;
    b.onclick = () => { year = y; try { localStorage.setItem(KEY + "-year", y); } catch (e) {} renderTabs(); renderList(); window.scrollTo(0, 0); };
    tabsEl.appendChild(b);
  });
}

function paint(card, q) {
  const pick = picks[idOf(q)];
  const btns = card.querySelectorAll(".opt");
  const verdict = card.querySelector(".verdict");
  btns.forEach(b => {
    b.classList.remove("correct", "wrong");
    b.disabled = !!pick;
    if (pick) {
      if (b.dataset.l === q.answer) b.classList.add("correct");
      else if (b.dataset.l === pick) b.classList.add("wrong");
    }
  });
  if (!pick) { verdict.hidden = true; return; }
  verdict.hidden = false;
  const ok = pick === q.answer;
  verdict.className = "verdict " + (ok ? "ok" : "bad");
  verdict.firstChild.textContent = ok ? "✓ إجابة صحيحة" : "✗ إجابة خاطئة — الصحيحة: " + q.answer;
}

function renderList() {
  listEl.innerHTML = "";
  DATA[year].forEach(q => {
    const card = document.createElement("article");
    card.className = "q"; card.id = "q-" + idOf(q);
    const head = document.createElement("div"); head.className = "q-head";
    const n = document.createElement("span"); n.className = "num"; n.textContent = q.num;
    const stem = document.createElement("p"); stem.className = "stem"; stem.dir = "auto"; stem.textContent = q.text;
    head.append(n, stem);
    if (q.shared) {
      const s = document.createElement("p"); s.className = "shared"; s.dir = "auto"; s.textContent = q.shared;
      card.appendChild(s);
    }
    card.appendChild(head);
    if (q.img) {
      const im = document.createElement("img"); im.className = "fig"; im.src = q.img; im.alt = "تخطيط القلب الكهربائي للسؤال " + q.num;
      card.appendChild(im);
    }
    const ul = document.createElement("ul"); ul.className = "opts";
    q.options.forEach(o => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button"; b.className = "opt"; b.dataset.l = o.letter; b.dir = "auto";
      const l = document.createElement("span"); l.className = "l"; l.textContent = o.letter + ".";
      const t = document.createElement("span"); t.className = "t"; t.dir = "auto"; t.textContent = o.text;
      b.append(l, t);
      b.onclick = () => { if (picks[idOf(q)]) return; picks[idOf(q)] = o.letter; save(); paint(card, q); score(); };
      li.appendChild(b); ul.appendChild(li);
    });
    const v = document.createElement("p"); v.className = "verdict"; v.hidden = true;
    v.appendChild(document.createTextNode(""));
    const r = document.createElement("button"); r.type = "button"; r.className = "retry"; r.textContent = "حاول مجدداً";
    r.onclick = () => { delete picks[idOf(q)]; save(); paint(card, q); score(); };
    v.appendChild(r);
    card.append(ul, v);
    listEl.appendChild(card);
    paint(card, q);
  });
  score();
}

function score() {
  let c = 0, w = 0;
  const qs = DATA[year];
  qs.forEach(q => { const p = picks[idOf(q)]; if (p) { if (p === q.answer) c++; else w++; } });
  document.getElementById("sc-c").textContent = c;
  document.getElementById("sc-w").textContent = w;
  document.getElementById("sc-r").textContent = qs.length - c - w;
  document.getElementById("prog").style.width = (qs.length ? (c + w) / qs.length * 100 : 0) + "%";
}

document.getElementById("reset").onclick = () => {
  DATA[year].forEach(q => delete picks[idOf(q)]);
  save(); renderList(); window.scrollTo(0, 0);
};

renderTabs(); renderList();
</script>
