# نشر wtn على خادم واحد.
#
#   cd /opt/wtn && docker compose -f deploy/docker-compose.yml up -d --build
#
# أربع خدمات: القاعدة، والموقع، وموجّهٌ يصنع شهادة HTTPS وحده، وبوت واتساب.
#
# **القاعدة عادت إلى الخادم (2026-08-23).** كانت على Neon، فبلغت خطتُها المجانية
# حدَّ نقل البيانات ورفضت كلَّ اتصال، فتوقّف الموقع يومين. والسبب بنيويّ لا
# عارض: القاعدة في أوهايو والخادم في ألمانيا، و`cron` يسألها كل دقيقة والبوت
# كل ثلاث ثوانٍ — فكل نبضةٍ تعبر المحيط وتُحسب من الحصّة.
#
# وحجّة إخراجها (ألّا تجتمع القاعدة ونسخُها على خادمٍ واحد) تبقى قائمة —
# يغلقها رفعُ النسخة خارج الخادم في [backup.sh](backup.sh) لا إبعادُ القاعدة.

name: wtn

services:
  # القاعدة بجوار الموقع: شبكةٌ داخلية لا تُحسب من حصّة نقلٍ ولا تعبر محيطاً.
  # لا `ports` — لا تُفتح إلى الإنترنت، يصل إليها `web` بالاسم `db` وحده.
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wtn}
      POSTGRES_USER: ${POSTGRES_USER:-wtn}
      # بلا كلمة سرّ لا تقلع الخدمة أصلاً — أوضح من قاعدةٍ تقبل الجميع
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD غير مضبوط في deploy/.env}
      # صريحٌ عمداً: نسخة 18 غيّرت الموضع الافتراضي، وتثبيتُه يُبقي المجلّد
      # المُركَّب هو مجلّدَ البيانات مهما رُقِّيت الصورة
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    # `web` ينتظرها جاهزةً لا مُقلِعة: `migrate` على قاعدةٍ لم تفتح بابها بعد
    # يسقط، و`set -e` في start.sh يقتل الحاوية فتدور في حلقة إقلاع
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wtn} -d ${POSTGRES_DB:-wtn}"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [wtn]

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    expose: ["8000"]
    # يخرج إلى الشبكة (مزوّدو الشحن) ويستقبل من caddy وحده
    networks: [wtn]
    depends_on:
      db:
        condition: service_healthy

  # يُبنى ولا يُسحب جاهزاً: الشهادة الشاملة للمتاجر تحتاج وحدة Cloudflare
  # التي لا توجد في الصورة الرسمية (caddy.Dockerfile يشرح لماذا).
  caddy:
    build:
      context: .
      dockerfile: caddy.Dockerfile
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./stores.caddy:/etc/caddy/stores.caddy:ro   # تُلحق إن وُجد المفتاح
      - caddy_data:/data      # الشهادات — لا تُحذف وإلا أُعيد إصدارها كل مرّة
      - caddy_config:/config
    # المفتاح من `deploy/.env` نفسه — لا ملفٍّ جديد: `env_file` لملفٍّ ناقص
    # يُفشل `up` كلَّه، فيصير نسيانُ المفتاح إسقاطاً للموقع لا تعطيلاً لميزة.
    # و`:-` تجعل غيابَه فراغاً لا خطأ.
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      # عناوين هذه النسخة — كل عميلٍ بدومينه (انظر Caddyfile)
      SITE_ADDRESSES: ${SITE_ADDRESSES:-wtn4.com, www.wtn4.com, api.wtn4.com}
    depends_on: [web]
    networks: [wtn]

  # بوت واتساب: كان على جهاز المالك فينام معه. هنا يعمل دائماً.
  # `network_mode` عادي كي يصل إلى الموقع بالاسم الداخلي `web`.
  bot:
    image: node:22-slim
    restart: unless-stopped
    working_dir: /app
    volumes: ["../bot:/app"]
    command: sh -c "npm ci --omit=dev && npm start"
    env_file: [.env.bot]
    depends_on: [web]
    networks: [wtn]

volumes:
  db_data:       # بيانات القاعدة — لا تُحذف. و`down -v` يمحوها، فلا تُستعمل
  caddy_data:
  caddy_config:

networks:
  wtn:
